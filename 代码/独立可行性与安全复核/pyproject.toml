[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "station-review"
version = "0.1.0"
description = "Independent deterministic offline station plan review"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["station_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
